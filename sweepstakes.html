<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sweeps">
<title>Sweepstakes Tracker — Decision-Support</title>
<style>
:root{
  --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --surface3:#222c38;
  --border:#2a3340; --border2:#374251;
  --text:#e6edf3; --muted:#8b97a5; --faint:#5d6b7a;
  --accent:#4f9dff; --accent-d:#2f6fce;
  --green:#34d399; --amber:#fbbf24; --red:#f87171; --purple:#a78bfa; --cyan:#22d3ee;
  --radius:14px; --radius-sm:10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom: calc(64px + var(--safe-b));
}
button{font-family:inherit; cursor:pointer; color:inherit}
input,select,textarea{font-family:inherit; font-size:16px}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-0.01em}
a{color:var(--accent); word-break:break-all}
.hidden{display:none !important}

header{
  position:sticky; top:0; z-index:30;
  background:rgba(14,17,22,.85); backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--border);
  padding: calc(10px + var(--safe-t)) 16px 10px;
  display:flex; align-items:center; gap:10px;
}
.brand{font-size:18px; font-weight:750; letter-spacing:.01em}
.brand .dot{color:var(--accent)}
.head-sub{color:var(--muted); font-size:12.5px; margin-left:2px}
.head-right{margin-left:auto; display:flex; gap:8px; align-items:center}

#view{padding:14px 14px 20px; max-width:720px; margin:0 auto}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 4px 8px; font-weight:700; display:flex; align-items:center; gap:8px}
.section-title:first-child{margin-top:2px}
.section-title .ct{margin-left:auto; color:var(--faint); font-weight:700}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px}
.card.tight{padding:11px}
.card.click{cursor:pointer; transition:border-color .15s, transform .04s}
.card.click:active{transform:scale(.995)}
.card.click:hover{border-color:var(--border2)}
.row{display:flex; align-items:center; gap:10px}
.row.wrap{flex-wrap:wrap}
.row.top{align-items:flex-start}
.spacer{flex:1}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.b{font-weight:700}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.wrapnice{word-break:break-word; overflow-wrap:anywhere}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  background:var(--surface2); border:1px solid var(--border2); color:var(--text);
  padding:11px 14px; border-radius:var(--radius-sm); font-size:15px; font-weight:600;
  transition:transform .04s ease, background .15s, border-color .15s; user-select:none;
}
.btn:active{transform:scale(.97)}
.btn.block{display:flex; width:100%}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#06101f}
.btn.green{background:var(--green); border-color:var(--green); color:#04140d}
.btn.ghost{background:transparent}
.btn.danger{background:transparent; border-color:#5a2c2c; color:var(--red)}
.btn.sm{padding:7px 10px; font-size:13px; border-radius:8px; font-weight:600}
.btn.xs{padding:5px 9px; font-size:12px; border-radius:7px; font-weight:600}
.btn:disabled{opacity:.4}
.iconbtn{background:var(--surface2); border:1px solid var(--border2); width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:16px}
.fab{position:fixed; right:16px; bottom:calc(72px + var(--safe-b)); z-index:35; width:54px; height:54px; border-radius:50%; background:var(--accent); border:0; color:#06101f; font-size:28px; font-weight:300; box-shadow:0 8px 24px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center}

.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px; background:var(--surface2); border:1px solid var(--border2); color:var(--muted); font-size:12.5px; font-weight:650; user-select:none; white-space:nowrap}
.chip.on{background:var(--accent); border-color:var(--accent); color:#06101f}
.chip.sm{padding:4px 9px; font-size:11.5px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chiprow{display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px; -webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}

.tag{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; border:1px solid transparent; white-space:nowrap}
.tag.low,.tag.green{background:rgba(52,211,153,.13); color:var(--green); border-color:rgba(52,211,153,.25)}
.tag.medium,.tag.amber{background:rgba(251,191,36,.13); color:var(--amber); border-color:rgba(251,191,36,.25)}
.tag.high,.tag.red{background:rgba(248,113,113,.13); color:var(--red); border-color:rgba(248,113,113,.28)}
.tag.blue{background:rgba(79,157,255,.14); color:var(--accent); border-color:rgba(79,157,255,.28)}
.tag.purple{background:rgba(167,139,250,.14); color:var(--purple); border-color:rgba(167,139,250,.28)}
.tag.gray{background:var(--surface2); color:var(--muted); border-color:var(--border2)}
.dotmark{width:8px;height:8px;border-radius:50%}

label.field{display:block; margin-bottom:11px}
label.field > span{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600}
label.field > span .req{color:var(--accent)}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{
  width:100%; background:var(--surface2); border:1px solid var(--border2); color:var(--text);
  padding:11px 12px; border-radius:var(--radius-sm); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical; min-height:60px; line-height:1.4}
.inline-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.inline-grid.g3{grid-template-columns:1fr 1fr 1fr}
.checkline{display:flex; align-items:flex-start; gap:9px; padding:7px 0; cursor:pointer}
.checkline input{width:20px; height:20px; flex:0 0 auto; margin-top:1px; accent-color:var(--accent)}
.checkline .t{font-size:13.5px}

.kv{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--border); font-size:14px}
.kv:first-child{border-top:0}
.kv .k{color:var(--muted); flex:0 0 auto}
.kv .v{text-align:right; word-break:break-word}
.divider{height:1px; background:var(--border); margin:12px 0}
.banner{background:linear-gradient(90deg,rgba(79,157,255,.15),rgba(167,139,250,.12)); border:1px solid var(--border2); border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px}
.flag{background:rgba(248,113,113,.10); border:1px solid #5a2c2c; color:#fca5a5; border-radius:10px; padding:9px 11px; font-size:13px; margin:8px 0}
.flag.amber{background:rgba(251,191,36,.09); border-color:#5a4a1c; color:#fcd56b}
.flag.green{background:rgba(52,211,153,.09); border-color:#1f5a45; color:#86efac}
.note{background:var(--surface2); border-left:3px solid var(--border2); padding:8px 11px; border-radius:8px; color:var(--muted); font-size:13px; margin:8px 0; white-space:pre-wrap}

.empty{text-align:center; color:var(--muted); padding:30px 14px}
.empty .big{font-size:40px; margin-bottom:8px; opacity:.5}

.scorebar{display:flex; align-items:center; gap:8px; margin:6px 0}
.scorebar .lab{width:120px; flex:0 0 auto; font-size:12.5px; color:var(--muted)}
.scorebar .track{flex:1; height:8px; background:var(--surface2); border-radius:6px; overflow:hidden}
.scorebar .fill{height:100%; background:var(--accent); border-radius:6px}
.scorebar .val{width:30px; text-align:right; font-size:12.5px; font-weight:700}
.seg{display:flex; background:var(--surface2); border:1px solid var(--border2); border-radius:10px; padding:3px; gap:3px}
.seg button{flex:1; border:0; background:transparent; color:var(--muted); font-weight:700; font-size:13px; padding:8px 4px; border-radius:7px}
.seg button.on{background:var(--accent); color:#06101f}
.seg.amber button.on{background:var(--amber); color:#1a1402}
.seg.red button.on{background:var(--red); color:#1a0606}
.seg.green button.on{background:var(--green); color:#04140d}

#nav{position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; background:rgba(20,25,32,.94); backdrop-filter:blur(12px); border-top:1px solid var(--border); padding-bottom: var(--safe-b)}
#nav button{flex:1; background:transparent; border:0; color:var(--muted); padding:9px 4px 8px; font-size:10.5px; font-weight:650; letter-spacing:.01em; display:flex; flex-direction:column; align-items:center; gap:3px; position:relative}
#nav button .ic{font-size:20px; line-height:1}
#nav button.on{color:var(--accent)}
#nav button .badge{position:absolute; top:4px; right:calc(50% - 22px); background:var(--accent); color:#06101f; font-size:9px; font-weight:800; min-width:15px; height:15px; padding:0 3px; border-radius:999px; display:flex; align-items:center; justify-content:center}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(80px + var(--safe-b)); background:var(--surface3); border:1px solid var(--border2); color:var(--text); padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:90%; text-align:center}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

.modal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center}
.modal .sheet{background:var(--surface); border:1px solid var(--border2); border-radius:18px 18px 0 0; width:100%; max-width:720px; max-height:92vh; overflow-y:auto; padding:16px 14px calc(20px + var(--safe-b)); animation:up .2s ease}
@keyframes up{from{transform:translateY(20px); opacity:.6}to{transform:translateY(0); opacity:1}}
.sheet h2{font-size:18px; margin-bottom:4px}
.sheetbar{display:flex; align-items:center; gap:10px; margin-bottom:12px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2); border-radius:4px}
.stat{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 8px; text-align:center}
.stat .n{font-size:22px; font-weight:800}
.stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px}
.recpill{display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:10px; font-weight:750; font-size:14px}
.rec-pursue{background:rgba(52,211,153,.15); color:var(--green); border:1px solid rgba(52,211,153,.3)}
.rec-maybe{background:rgba(251,191,36,.15); color:var(--amber); border:1px solid rgba(251,191,36,.3)}
.rec-skip{background:rgba(248,113,113,.13); color:var(--red); border:1px solid rgba(248,113,113,.3)}
.rec-research{background:rgba(79,157,255,.14); color:var(--accent); border:1px solid rgba(79,157,255,.3)}
.linkline{font-size:12.5px; color:var(--muted); margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="brand">Sweeps<span class="dot">·</span>Tracker</div>
  <div class="head-sub" id="headSub">Decision-support</div>
  <div class="head-right" id="headRight"></div>
</header>

<div id="view"></div>
<button class="fab hidden" id="fab" onclick="fabAction()">+</button>

<nav id="nav">
  <button data-tab="home" onclick="go('home')"><span class="ic">🏁</span>Home</button>
  <button data-tab="tracker" onclick="go('tracker')"><span class="ic">📋</span>Tracker</button>
  <button data-tab="review" onclick="go('review')"><span class="ic">🔍</span>Review</button>
  <button data-tab="log" onclick="go('log')"><span class="ic">📝</span>Log</button>
  <button data-tab="settings" onclick="go('settings')"><span class="ic">⚙️</span>More</button>
</nav>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============================================================
   Sweepstakes Tracker — manual-first decision-support system
   Single file, offline, localStorage-backed.
   Philosophy: review official rules, score strictly, track entries,
   prevent duplicates / over-limit entries, avoid scams. No auto-entry.
   ============================================================ */

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const view = $('#view');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function nowTS(){ return Date.now(); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtClock(ts){ if(!ts) return ''; const d=new Date(ts); let h=d.getHours(), m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; }
function daysBetween(aIso,bIso){ const a=new Date(aIso+'T00:00:00'), b=new Date(bIso+'T00:00:00'); return Math.round((b-a)/86400000); }
function daysUntil(iso){ if(!iso) return null; return daysBetween(todayISO(), iso); }
function addDaysIso(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoOf(d); }
function addMonthsIso(iso,n){ const d=new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+n); return isoOf(d); }
function money(n){ if(n==null||n===''||isNaN(n)) return '—'; const v=Number(n); return '$'+v.toLocaleString(undefined,{maximumFractionDigits:0}); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function pick(label){ return label; }

/* ---------- vocab ---------- */
const FREQ = {'one-time':'One-time','daily':'Daily','weekly':'Weekly','monthly':'Monthly','mail-in':'Mail-in / varies'};
const METHODS = ['Online form','Email','Social media','Mail-in','In-store / QR','Phone','Other'];
const RISK = ['low','medium','high'];
const CONCERN = ['low','medium','high'];
const TIME = ['quick','medium','annoying'];
const STATUSES = {
  researching:{label:'Researching', tag:'blue'},
  active:{label:'Active', tag:'green'},
  entered:{label:'Entered', tag:'green'},
  'daily-repeat':{label:'Daily repeat', tag:'purple'},
  'weekly-repeat':{label:'Weekly repeat', tag:'purple'},
  maybe:{label:'Maybe', tag:'amber'},
  skipped:{label:'Skipped', tag:'gray'},
  expired:{label:'Expired', tag:'gray'},
  'not-eligible':{label:'Not eligible', tag:'gray'},
  won:{label:'Won', tag:'green'},
  'dq-risk':{label:'Disqualified risk', tag:'red'},
};
const RECS = {
  pursue:{label:'Pursue', cls:'rec-pursue', icon:'✅'},
  maybe:{label:'Maybe', cls:'rec-maybe', icon:'🤔'},
  skip:{label:'Skip', cls:'rec-skip', icon:'⛔️'},
  research:{label:'Research more', cls:'rec-research', icon:'🔬'},
};
const SCORE_CATS = [
  ['legitimacy','Legitimacy'],
  ['prizeValue','Prize value'],
  ['entryEffort','Entry effort (easy=high)'],
  ['eligibilityClarity','Eligibility clarity'],
  ['privacySafety','Privacy safety'],
  ['deadlineUrgency','Deadline urgency'],
  ['repeatValue','Repeat-entry value'],
];
const RED_FLAGS = [
  ['noSponsor','No clear / identifiable sponsor'],
  ['noRules','No official rules available'],
  ['payment','Requires payment to enter'],
  ['creditCard','Requires credit card info'],
  ['ssn','Requires SSN / sensitive info before winning'],
  ['sketchyApp','Requires downloading an unknown app'],
  ['unrealistic','Unrealistic prize with vague terms'],
  ['alreadyWon','Uses “you already won” language'],
  ['surveys','Pushes endless surveys / offers'],
  ['referrals','Requires referrals / social spam'],
  ['domainMismatch','Domain does not match the sponsor'],
  ['farm','Looks like a sweepstakes farm, not official'],
  ['optins','Confusing opt-ins / unclear unsubscribe'],
  ['countdown','Deceptive countdown / pressure tactics'],
];

/* ---------- state ---------- */
const LS_KEY='swt_state_v1';
let memoryOnly=false;
function newOpp(){
  return {
    id:uid(), name:'', sponsor:'', sponsorVerified:false, officialUrl:'', rulesUrl:'', hasRules:false,
    prize:'', arv:'', deadline:'', eligibility:'', locationRestrict:'', ageRestrict:'',
    entryMethod:'Online form', entryFrequency:'one-time', maxEntries:'',
    purchaseRequired:false, noPurchaseMethod:'',
    entryLimitNote:'', householdLimit:'', affidavitRequired:false, amoeConfirmed:false,
    riskLevel:'medium', privacyConcern:'medium', timeRequired:'medium',
    eligibleSelf:'unknown', // yes | no | unknown
    redFlags:[],
    scores:{legitimacy:3,prizeValue:3,entryEffort:3,eligibilityClarity:3,privacySafety:3,deadlineUrgency:3,repeatValue:1},
    recommendation:'', // user-chosen; '' => use suggestion
    status:'researching', notes:'',
    emailUsed:'', createdAt:nowTS(), updatedAt:nowTS()
  };
}
function defaultState(){
  return { v:1, tab:'home', settings:{defaultEmail:'', strictMode:true}, opps:[], entries:[], queue:[], trackerFilter:'all' };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ memoryOnly=true; } }
function loadState(){
  try{ const r=localStorage.getItem(LS_KEY); if(r){ return migrate(JSON.parse(r)); } }catch(e){ memoryOnly=true; }
  return defaultState();
}
function migrate(s){
  const d=defaultState();
  s.settings=Object.assign({}, d.settings, s.settings||{});
  if(!Array.isArray(s.opps)) s.opps=[];
  if(!Array.isArray(s.entries)) s.entries=[];
  if(!Array.isArray(s.queue)) s.queue=[];
  if(!s.trackerFilter) s.trackerFilter='all';
  s.opps.forEach(o=>{ const base=newOpp(); for(const k in base){ if(o[k]===undefined) o[k]=base[k]; } if(!o.scores) o.scores=base.scores; if(!Array.isArray(o.redFlags)) o.redFlags=[]; });
  return s;
}
let state = loadState();

/* ---------- derived: entries / eligibility ---------- */
function entriesFor(oppId){ return state.entries.filter(e=>e.oppId===oppId).sort((a,b)=>a.ts-b.ts); }
function totalEntriesFor(oppId){ return entriesFor(oppId).reduce((n,e)=>n+(Number(e.count)||0),0); }
function lastEntry(oppId){ const es=entriesFor(oppId); return es.length?es[es.length-1]:null; }
function isExpired(o){ return o.deadline && daysUntil(o.deadline)<0; }

// Next eligible entry date based on frequency + last entry.
function nextEligible(o){
  const last=lastEntry(o.id);
  if(!last) return {state:'never'};                  // never entered yet
  const f=o.entryFrequency;
  if(f==='one-time') return {state:'done'};          // single entry already used
  if(f==='mail-in'||!FREQ[f]) return {state:'manual'};
  let next;
  if(f==='daily') next=addDaysIso(last.dateISO,1);
  else if(f==='weekly') next=addDaysIso(last.dateISO,7);
  else if(f==='monthly') next=addMonthsIso(last.dateISO,1);
  return {state:'date', iso:next, ready: daysBetween(todayISO(),next)<=0};
}
// Can the user enter this opportunity today?
function canEnterToday(o){
  if(isExpired(o)) return false;
  if(['skipped','expired','not-eligible','won','dq-risk'].includes(o.status)) return false;
  if(o.eligibleSelf==='no') return false;
  if(o.maxEntries && totalEntriesFor(o.id)>=Number(o.maxEntries)) return false;
  const ne=nextEligible(o);
  if(ne.state==='never') return true;
  if(ne.state==='done') return false;
  if(ne.state==='manual') return true;
  return !!ne.ready;
}

/* ---------- scoring + recommendation engine ---------- */
function scoreTotal(o){ return SCORE_CATS.reduce((n,[k])=>n+(Number(o.scores[k])||0),0); } // 0..35
function scorePct(o){ return Math.round(scoreTotal(o)/35*100); }

// Strict, override-driven suggestion. Returns {rec, reasons[], hard[], research[]}.
function suggest(o){
  const hard=[], research=[], soft=[];
  const fl=o.redFlags||[];
  // ---- hard skips ----
  if(o.eligibleSelf==='no') hard.push('You are not eligible');
  if(o.purchaseRequired) hard.push('Purchase / paid entry required');
  if(fl.includes('payment')) hard.push('Requires payment to enter');
  if(fl.includes('creditCard')) hard.push('Requires credit card');
  if(fl.includes('ssn')) hard.push('Requires SSN / sensitive info before winning');
  if(fl.includes('noSponsor') || !o.sponsor.trim()) hard.push('No clear sponsor');
  if(fl.includes('unrealistic')) hard.push('Unrealistic prize with vague terms');
  if(fl.includes('alreadyWon')) hard.push('“You already won” language');
  if(fl.includes('farm')) hard.push('Looks like a sweepstakes farm');
  if(fl.includes('sketchyApp')) hard.push('Requires an unknown app download');
  // ---- research triggers ----
  if(fl.includes('noRules') || (!o.rulesUrl.trim() && !o.hasRules)) research.push('Official rules not confirmed');
  if(!o.deadline) research.push('Deadline unknown');
  if(o.eligibleSelf==='unknown') research.push('Eligibility unconfirmed');
  if(!o.sponsorVerified) research.push('Sponsor not verified');
  // ---- soft cautions ----
  if(o.privacyConcern==='high') soft.push('High privacy concern');
  if(o.timeRequired==='annoying') soft.push('Entry process is annoying');
  if(o.riskLevel==='medium') soft.push('Medium risk — proceed with caution');

  const score=scoreTotal(o);
  let rec, reasons;
  if(hard.length){ rec='skip'; reasons=hard; }
  else if(o.riskLevel==='high'){
    // high risk only survives if prize is genuinely big AND sponsor verified
    if(o.sponsorVerified && Number(o.arv)>=5000 && research.length===0){ rec='maybe'; reasons=['High risk but verified sponsor & high-value prize'].concat(soft); }
    else { rec='skip'; reasons=['High risk'].concat(research); }
  }
  else if(research.length>=2 || (research.length>=1 && score<14)){ rec='research'; reasons=research; }
  else if(score>=24){ rec='pursue'; reasons=['Strong score, low blockers'].concat(soft); }
  else if(score>=15){ rec='maybe'; reasons=['Decent but not compelling'].concat(soft).concat(research); }
  else if(research.length){ rec='research'; reasons=research; }
  else { rec='maybe'; reasons=['Weak score'].concat(soft); }
  return {rec, reasons:reasons.filter(Boolean), hard, research, soft, score};
}
function effectiveRec(o){ return o.recommendation || suggest(o).rec; }

// draft field helpers (read DOM live so we don't re-render on every keystroke)
function fText(k,label,req,type){ const t=type||'text'; return `<label class="field"><span>${label}${req?' <span class="req">*</span>':''}</span><input type="${t}" value="${esc(draft[k])}" oninput="draft.${k}=this.value;refreshSuggest()"></label>`; }
function fNum(k,label){ return `<label class="field"><span>${label}</span><input type="number" inputmode="decimal" value="${esc(draft[k])}" oninput="draft.${k}=this.value;refreshSuggest()"></label>`; }
function fDate(k,label){ return `<label class="field"><span>${label}</span><input type="date" value="${esc(draft[k])}" oninput="draft.${k}=this.value;refreshSuggest()"></label>`; }
function fArea(k,label){ return `<label class="field"><span>${label}</span><textarea oninput="draft.${k}=this.value">${esc(draft[k])}</textarea></label>`; }
function fCheck(k,label){ return `<label class="checkline"><input type="checkbox" ${draft[k]?'checked':''} onchange="draft.${k}=this.checked;refreshSuggest()"><span class="t">${label}</span></label>`; }
function fSelect(k,label,opts,fmt){ return `<label class="field"><span>${label}</span><select onchange="draft.${k}=this.value;refreshSuggest()">`+opts.map(v=>`<option value="${esc(v)}" ${draft[k]===v?'selected':''}>${esc(fmt?fmt(v):v)}</option>`).join('')+`</select></label>`; }
function fSeg(k,label,opts,colors){ return `<label class="field"><span>${label}</span><div class="seg ${colors&&colors[draft[k]]?colors[draft[k]]:''}">`+opts.map(v=>`<button class="${draft[k]===v?'on':''}" onclick="setDraft('${k}','${v}')">${v}</button>`).join('')+`</div></label>`; }
function setDraft(k,v){ draft[k]=v; renderOppEdit(!state.opps.find(x=>x.id===draft.id)); }
function setScore(k,v){ draft.scores[k]=Number(v); refreshSuggest(); const cnt=document.querySelector('.section-title .ct'); /* lightweight: update suggestion only */ }
function toggleFlag(k,on){ if(on){ if(!draft.redFlags.includes(k)) draft.redFlags.push(k); } else { draft.redFlags=draft.redFlags.filter(x=>x!==k); } refreshSuggest(); }
function refreshSuggest(){
  const s=suggest(draft);
  const fl=document.querySelector('.modal .flag'); if(!fl) return;
  fl.className='flag '+(s.rec==='skip'?'':s.rec==='pursue'?'green':'amber');
  fl.innerHTML=`<span class="b">Live suggestion: ${RECS[s.rec].icon} ${RECS[s.rec].label}</span> · score ${s.score}/35${s.reasons.length?`<div class="small" style="margin-top:3px">${s.reasons.slice(0,3).map(esc).join(' · ')}</div>`:''}`;
}
function saveOpp(){
  if(!draft.name.trim()){ toast('Name is required'); return; }
  draft.updatedAt=nowTS();
  const i=state.opps.findIndex(x=>x.id===draft.id);

  if(i<0){
    const dup=state.opps.find(o=> o.name.trim().toLowerCase()===draft.name.trim().toLowerCase() || (draft.officialUrl && o.officialUrl===draft.officialUrl));
    if(dup && !confirm('A similar sweepstakes ("'+dup.name+'") is already tracked. Add anyway?')) return;

function renderLogEntry(o){

  h+=`<label class="checkline"><input type="checkbox" onchange="entryDraft.ruleConcern=this.checked"><span class="t">Flag a possible rule concern about this entry</span></label>`;
  h+=`<label class="field"><span>Notes</span><textarea oninput="entryDraft.notes=this.value" placeholder="e.g. entered 25 times at 12:59 PM">${esc(entryDraft.notes)}</textarea></label>`;
  h+=`</div>`;
  h+=`<button class="btn green block" onclick="commitEntry()">✓ Save entry</button>`;
  openSheet(h);
}
function commitEntry(){
  entryDraft.ts=new Date(entryDraft.dateISO+'T'+new Date().toTimeString().slice(0,8)).getTime()||nowTS();
  entryDraft.count=Math.max(1,Number(entryDraft.count)||1);
  state.entries.push(entryDraft);
  const o=state.opps.find(x=>x.id===entryDraft.oppId);
  if(o){
    // auto-advance status sensibly
    if(o.status==='active'||o.status==='maybe'||o.status==='researching'){
      o.status = o.entryFrequency==='daily'?'daily-repeat':o.entryFrequency==='weekly'?'weekly-repeat':'entered';
    }
    o.updatedAt=nowTS();
  }
  save(); closeModal(); render();
  toast('Entry logged'+(o&&nextEligible(o).state==='date'?' · next: '+fmtDateShort(nextEligible(o).iso):''));
}

function normUrl(u){ return String(u||'').trim().toLowerCase().replace(/[#?].*$/,'').replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,''); }
function saveQueue(){
  if(!queueDraft.link.trim()){ toast('A link is required'); return; }
  const i=state.queue.findIndex(x=>x.id===queueDraft.id);
  // duplicate guard: warn if this link is already queued or already reviewed
  const nl=normUrl(queueDraft.link);
  if(nl){
    const dupO=state.opps.find(o=>normUrl(o.officialUrl)===nl || normUrl(o.rulesUrl)===nl);
    const dupQ=state.queue.find(x=>x.id!==queueDraft.id && normUrl(x.link)===nl);
    if(dupO && !confirm('You already reviewed this link ("'+(dupO.name||'a tracked sweepstakes')+'"). Add it to the queue anyway?')) return;
    else if(!dupO && dupQ && !confirm('This link is already in your review queue. Add it again anyway?')) return;
  }
  if(i<0) state.queue.unshift(queueDraft); else state.queue[i]=queueDraft;
  save(); closeModal(); render(); toast('Lead saved');
}
function deleteQueue(id){ if(!confirm('Delete this lead?')) return; state.queue=state.queue.filter(x=>x.id!==id); save(); render(); }
function setQueueDone(id,done){ const q=state.queue.find(x=>x.id===id); if(q){ q.reviewStatus=done?'done':'new'; save(); render(); } }
function promoteQueue(id){
  const q=state.queue.find(x=>x.id===id); if(!q) return;
  draft=newOpp();
  draft.officialUrl=q.link; draft.notes=q.notes?('From queue: '+q.notes):'';
  if(state.settings.defaultEmail) draft.emailUsed=state.settings.defaultEmail;
  q.reviewStatus='done';
  save();
  renderOppEdit(true);
}

function download(name,text,type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),500); }
function exportJSON(){ download('sweepstakes-tracker-'+todayISO()+'.json', JSON.stringify(state,null,2), 'application/json'); toast('Exported'); }
function exportCSV(){
  const cols=['name','sponsor','officialUrl','rulesUrl','prize','arv','deadline','eligibility','entryMethod','entryFrequency','maxEntries','purchaseRequired','noPurchaseMethod','riskLevel','privacyConcern','timeRequired','recommendation','status','score','entriesLogged','nextEligible','notes'];
  const rows=[cols.join(',')];
  state.opps.forEach(o=>{
    const ne=nextEligible(o); const neTxt=ne.state==='date'?ne.iso:ne.state;
    const vals=[o.name,o.sponsor,o.officialUrl,o.rulesUrl,o.prize,o.arv,o.deadline,o.eligibility,o.entryMethod,o.entryFrequency,o.maxEntries,o.purchaseRequired,o.noPurchaseMethod,o.riskLevel,o.privacyConcern,o.timeRequired,effectiveRec(o),o.status,scoreTotal(o),totalEntriesFor(o.id),neTxt,o.notes];
    rows.push(vals.map(v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','));
  });
  download('sweepstakes-'+todayISO()+'.csv', rows.join('\n'), 'text/csv');
  toast('CSV exported');
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.opps&&!s.entries) throw 0; if(!confirm('Replace all current data with the imported file?')) return; state=migrate(s); save(); render(); toast('Imported'); }catch(e){ toast('Invalid file'); } };
  r.readAsText(f);
}
function wipeAll(){ if(!confirm('Erase ALL sweepstakes, entries and leads? This cannot be undone.')) return; state=defaultState(); save(); render(); toast('All data reset'); }

  state.opps.push(o);
  // an example entry log mirroring the proven event
  state.entries.push({id:uid(), oppId:o.id, dateISO:todayISO(), ts:nowTS(), method:'Online form', count:25, confirmation:'', emailUsed:state.settings.defaultEmail||'', notes:'25 manual entries completed ~12:59 PM. Continue only if frequency & max-entry rules allow.', ruleConcern:false});
  save(); state.tab='tracker'; render(); toast('Example loaded');
}

/* ---------- modal plumbing ---------- */
function openSheet(html){ $('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; document.body.style.overflow='hidden'; }
function closeModal(){ $('#modalRoot').innerHTML=''; document.body.style.overflow=''; draft=null; entryDraft=null; queueDraft=null; }

/* ---------- auto-expire: roll past-deadline sweeps to "expired" on load ---------- */
function autoExpireOnLoad(){
  let n=0;
  state.opps.forEach(o=>{ if(isExpired(o) && !['expired','skipped','won','not-eligible'].includes(o.status)){ o.status='expired'; o.updatedAt=nowTS(); n++; } });
  if(n) save();
}

/* ---------- installable web-app icon + manifest (single-file, generated at runtime) ---------- */
function setupPWA(){
  try{
    function iconDataURL(size){
      const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
      const r=Math.round(size*0.22);
      x.fillStyle='#0e1116'; x.fillRect(0,0,size,size);
      // rounded accent square
      x.fillStyle='#4f9dff';
      const pad=Math.round(size*0.16), s=size-pad*2;
      x.beginPath();
      x.moveTo(pad+r,pad);
      x.arcTo(pad+s,pad, pad+s,pad+s, r);
      x.arcTo(pad+s,pad+s, pad,pad+s, r);
      x.arcTo(pad,pad+s, pad,pad, r);
      x.arcTo(pad,pad, pad+s,pad, r);
      x.closePath(); x.fill();
      // letter
      x.fillStyle='#06101f';
      x.font='bold '+Math.round(size*0.5)+'px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
      x.textAlign='center'; x.textBaseline='middle';
      x.fillText('S', size/2, size*0.54);
      return c.toDataURL('image/png');
    }
    const icon192=iconDataURL(192), icon512=iconDataURL(512);
    const at=document.createElement('link'); at.rel='apple-touch-icon'; at.href=icon192; document.head.appendChild(at);
    const fav=document.createElement('link'); fav.rel='icon'; fav.type='image/png'; fav.href=icon192; document.head.appendChild(fav);
    const manifest={ name:'Sweepstakes Tracker', short_name:'Sweeps', start_url:'.', scope:'.', display:'standalone', orientation:'portrait', background_color:'#0e1116', theme_color:'#0e1116', icons:[{src:icon192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'}] };
    const url=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    const ml=document.createElement('link'); ml.rel='manifest'; ml.href=url; document.head.appendChild(ml);
  }catch(e){ /* icon generation is best-effort; app still works without it */ }
}

/* ---------- boot ---------- */
autoExpireOnLoad();
setupPWA();
render();
</script>
